name: Deploy Frontend to Netlify

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-netlify.yml"
  workflow_run:
    workflows:
      - Deploy Backend to Cloud Run
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: netlify-frontend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'flight-search-backend' }}
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required GitHub configuration
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "Missing repository variable GCP_PROJECT_ID" >&2
            exit 1
          fi

          if [ -z "${GCP_REGION}" ]; then
            echo "Missing repository variable GCP_REGION" >&2
            exit 1
          fi

          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "Missing repository secret GCP_SA_KEY" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve backend URL
        run: |
          BACKEND_URL="${VITE_BACKEND_URL}"

          if [ -z "${BACKEND_URL}" ]; then
            BACKEND_URL="$(
              gcloud run services describe "${CLOUD_RUN_SERVICE}" \
                --region="${GCP_REGION}" \
                --project="${GCP_PROJECT_ID}" \
                --format='value(status.url)'
            )"
          fi

          if [ -z "${BACKEND_URL}" ]; then
            echo "Failed to resolve backend URL from VITE_BACKEND_URL or Cloud Run service ${CLOUD_RUN_SERVICE}" >&2
            exit 1
          fi

          echo "VITE_BACKEND_URL=${BACKEND_URL}" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=frontend/dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
